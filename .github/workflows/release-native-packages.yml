name: release-native-packages

on:
  workflow_run:
    workflows: [release]
    types: [completed]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Find the successful release tag
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$TAG" ]; then
            echo "::error::the completed release run is not attached to a version tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  rpm:
    needs: prepare
    runs-on: ubuntu-24.04
    container:
      image: fedora:45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install RPM build tools
        run: dnf install -y curl rpm-build systemd-rpm-macros
      - name: Build gigactld RPM
        run: |
          TOPDIR="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          COMMIT=$(sed -n 's/^%global commit //p' packaging/rpm/gigactld.spec)
          curl --fail --location --retry 3 \
            "https://github.com/smairio/gigactl/archive/${COMMIT}.tar.gz" \
            --output "$TOPDIR/SOURCES/${COMMIT}.tar.gz"
          rpmbuild -ba --define "_topdir $TOPDIR" packaging/rpm/gigactld.spec
          mkdir -p dist
          cp "$TOPDIR"/RPMS/noarch/*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gigactld-rpm
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    needs: prepare
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Arch build tools
        run: pacman -Syu --noconfirm --needed base-devel git shadow util-linux
      - name: Build gigactld Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -c 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg --nodeps --noconfirm --cleanbuild'
          mkdir -p dist
          cp packaging/arch/*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gigactld-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: [prepare, rpm, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach native packages to the existing upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/gigactld-rpm/*.rpm \
            dist/gigactld-arch/*.pkg.tar.zst --clobber
